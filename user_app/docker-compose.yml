version: "3.8"

services:
  user-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080/user}
    restart: unless-stopped
    networks:
      - zytra-network

networks:
  zytra-network:
    driver: bridge
